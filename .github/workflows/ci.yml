name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Offline regression (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run all offline checks
        run: python scripts/check.py
      - name: Compile host-side RC522 regression
        run: >-
          g++ -std=c++17
          -I tests/software_mfrc522_host
          -I firmware/uno_robot_esp01_rfid_relay
          firmware/uno_robot_esp01_rfid_relay/SoftwareMFRC522.cpp
          tests/software_mfrc522_host/test_software_mfrc522.cpp
          -o /tmp/software_mfrc522_test
          && /tmp/software_mfrc522_test

  firmware-compile:
    name: Arduino Uno firmware compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Create public CI network configuration
        run: |
          cp firmware/uno_robot_esp01_rfid_relay/robot_network_config.example.h firmware/uno_robot_esp01_rfid_relay/robot_network_config.h
          cp firmware/uno_zone2_rfid_drive_diagnostic/zone2_rfid_drive_config.example.h firmware/uno_zone2_rfid_drive_diagnostic/zone2_rfid_drive_config.h
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          platforms: |
            - name: arduino:avr
              version: 1.8.6
          sketch-paths: |
            - firmware/uno_robot_esp01_rfid_relay
            - firmware/uno_line_tracker_motor_controller
            - firmware/uno_humidity_module_controller
            - firmware/uno_motor_power_diagnostic
            - firmware/uno_zone2_rfid_drive_diagnostic
            - firmware/uno_home_rfid_registration
          libraries: |
            - name: DHT sensor library
              version: 1.4.6
            - source-url: https://github.com/PhoenixSmaug/AFMotor-Shield-R4-Compatible.git
              version: bf6fb3ac77032ce7c63ea963e269e72de87d4c5c
          cli-compile-flags: |
            - --warnings
            - all
          sketches-report-path: sketches-reports
          enable-warnings-report: true
      - name: Enforce SensorUno memory budget
        run: python3 scripts/check_firmware_size.py sketches-reports
